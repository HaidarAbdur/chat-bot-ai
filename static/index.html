<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot AI — Asisten Cerdas</title>
    <meta name="description"
        content="Chatbot AI berbasis LLM — asisten cerdas untuk percakapan natural dalam Bahasa Indonesia.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L2 7l10 5 10-5-10-5z" />
                            <path d="M2 17l10 5 10-5" />
                            <path d="M2 12l10 5 10-5" />
                        </svg>
                    </div>
                    <span class="logo-text">Chatbot AI</span>
                </div>
                <button class="sidebar-toggle" id="sidebarClose" aria-label="Tutup sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Chat Baru
            </button>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Info Model</div>
                <div class="model-info">
                    <div class="model-badge">
                        <span class="model-dot"></span>
                        <span id="modelName">LLaMA 3.3 70B</span>
                    </div>
                    <p class="model-provider">via Groq API</p>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="sidebar-footer-text">
                    Built with Radenn
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Top Bar -->
            <header class="chat-header">
                <button class="menu-btn" id="menuBtn" aria-label="Buka sidebar">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <div class="header-title">
                    <h1>Asisten AI</h1>
                    <span class="header-status" id="headerStatus">Online</span>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="resetBtn" title="Reset Percakapan" aria-label="Reset percakapan">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10" />
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Messages Container -->
            <div class="chat-messages" id="chatMessages">
                <!-- Welcome Screen -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="url(#welcomeGrad)"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <defs>
                                <linearGradient id="welcomeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#818cf8" />
                                    <stop offset="100%" style="stop-color:#c084fc" />
                                </linearGradient>
                            </defs>
                            <path d="M12 2L2 7l10 5 10-5-10-5z" />
                            <path d="M2 17l10 5 10-5" />
                            <path d="M2 12l10 5 10-5" />
                        </svg>
                    </div>
                    <h2>Halo! Saya Asisten AI Anda 👋</h2>
                    <p>Saya siap membantu menjawab pertanyaan, berdiskusi, atau sekadar ngobrol santai.</p>
                    <div class="suggestion-chips">
                        <button class="chip" data-message="Ceritakan tentang dirimu">💬 Ceritakan tentang
                            dirimu</button>
                        <button class="chip" data-message="Apa saja yang bisa kamu bantu?">🤔 Apa yang bisa kamu
                            bantu?</button>
                        <button class="chip" data-message="Jelaskan cara kerja AI secara sederhana">🧠 Jelaskan cara
                            kerja AI</button>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input-container">
                <form class="chat-input-form" id="chatForm">
                    <div class="input-wrapper">
                        <textarea id="messageInput" placeholder="Ketik pesan Anda..." rows="1" autocomplete="off"
                            aria-label="Input pesan"></textarea>
                        <button type="submit" class="send-btn" id="sendBtn" aria-label="Kirim pesan" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13" />
                                <polygon points="22 2 15 22 11 13 2 9 22 2" />
                            </svg>
                        </button>
                    </div>
                    <p class="input-disclaimer">AI bisa membuat kesalahan. Periksa informasi penting secara mandiri.</p>
                </form>
            </div>
        </main>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script src="/static/app.js"></script>
</body>

</html>
